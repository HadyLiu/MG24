# QA — host 单元测试 + Google 风格检查 + cppcheck（User/）
# 报告对齐豪庭：unit_test_report.tar.gz、code_quality_report.tar.gz

name: QA

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y gcovr

      - name: Setup host test tools
        run: |
          chmod +x qa/host/setup.sh
          ./qa/host/setup.sh

      - name: Run host unit tests
        run: |
          chmod +x qa/host/run_host_tests.sh
          ./qa/host/run_host_tests.sh

      - name: Pack unit test report
        if: always()
        run: |
          chmod +x qa/PackQualityReports.sh
          ./qa/PackQualityReports.sh --unit-only qa

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit_test_report
          path: qa/unit_test_report.tar.gz
          if-no-files-found: error
          retention-days: 14

  code-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-format python3-pygments python3-pip

      - name: clang-format check User/
        run: |
          chmod +x qa/format/run_clang_format.sh
          ./qa/format/run_clang_format.sh --check

      - name: Setup cpplint and cppcheck-htmlreport
        if: always()
        run: |
          chmod +x qa/cpplint/setup.sh qa/cppcheck/setup.sh
          ./qa/cpplint/setup.sh
          ./qa/cppcheck/setup.sh

      - name: cpplint User/
        if: always()
        run: |
          chmod +x qa/cpplint/run_cpplint.sh
          ./qa/cpplint/run_cpplint.sh

      - name: cppcheck User/
        if: always()
        run: |
          chmod +x qa/cppcheck/run_cppcheck.sh
          ./qa/cppcheck/run_cppcheck.sh

      - name: Pack code quality report
        if: always()
        run: |
          chmod +x qa/PackQualityReports.sh
          ./qa/PackQualityReports.sh --quality-only qa

      - name: Upload code quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code_quality_report
          path: qa/code_quality_report.tar.gz
          if-no-files-found: error
          retention-days: 14

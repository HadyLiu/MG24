# Lint — Shell / Workflow YAML（借自 rs-hs-lint：shellcheck + actionlint + yamllint）
# 触发：每次 push / PR（main、develop）+ 手动。

name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck scripts
        run: |
          set -euo pipefail
          scripts=(
            docker/entrypoint.sh
            docker/build-image.sh
            docker/install-slt-packages.sh
            Srcipt/CiLocal.sh
            Srcipt/ReadFirmwareVersion.sh
            Srcipt/CheckReleaseTag.sh
            Srcipt/PackRelease.sh
            Srcipt/UpdateFirmwareVersion.sh
            Srcipt/PublishOta.sh
            qa/host/run_host_tests.sh
            qa/host/setup.sh
            qa/cppcheck/run_cppcheck.sh
            qa/cppcheck/setup.sh
            qa/cpplint/run_cpplint.sh
            qa/cpplint/setup.sh
            qa/format/run_clang_format.sh
            qa/PackQualityReports.sh
          )
          echo "Checking:"
          printf '  %s\n' "${scripts[@]}"
          shellcheck --severity=warning "${scripts[@]}"

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: YAML lint workflows
        run: |
          pip install --user yamllint
          ~/.local/bin/yamllint -c .github/yamllint.yml .github/workflows/

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download actionlint
        id: get_actionlint
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash \
            -o /tmp/download-actionlint.bash
          bash /tmp/download-actionlint.bash 1.7.12
        shell: bash

      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

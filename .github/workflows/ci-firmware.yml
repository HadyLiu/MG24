# CI Firmware — 固件编译
# 触发：每次 push / PR（main、develop）+ 手动。
# 依赖：GHCR 上已有完整编译镜像（先跑 Docker Publish）。

name: CI Firmware

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: li-bat-matterlight
  IMAGE_TAG: sdk-2025.12.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Resolve image reference
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull firmware build image
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.ref }}"
          if ! docker pull "${image}"; then
            echo "::error::找不到镜像 ${image}"
            echo "请先：Actions → Docker Publish → Run workflow"
            echo "或本机：docker tag ... && docker push ${image}"
            exit 1
          fi

      # 镜像内用户 hadyliu 固定 UID 1000；GHA 工作区属 runner，需对齐才能写 build/
      - name: Allow container user to write workspace
        run: sudo chown -R 1000:1000 "${{ github.workspace }}"

      - name: Build firmware (docker run build)
        run: |
          docker run --rm \
            -e LI_BAT_BUILD_VARIANT=dev \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            "${{ steps.image.outputs.ref }}" \
            build

      - name: Restore workspace ownership for runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            artifact/*.s37
            artifact/*.gbl
          if-no-files-found: error
          retention-days: 14

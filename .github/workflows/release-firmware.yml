# Release Firmware — Tag v* 正式发布

name: Release Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的版本 Tag（如 v1.1.6）；留空则仅构建并上传 Artifact'
        required: false
        default: ''

concurrency:
  group: release-firmware-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: li-bat-matterlight
  IMAGE_TAG: sdk-2025.12.2

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches firmware version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          chmod +x Srcipt/ReadFirmwareVersion.sh Srcipt/CheckReleaseTag.sh
          ./Srcipt/CheckReleaseTag.sh "${GITHUB_REF_NAME}"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Resolve image reference
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull firmware build image
        run: docker pull "${{ steps.image.outputs.ref }}"

      - name: Allow container user to write workspace
        run: sudo chown -R 1000:1000 "${{ github.workspace }}"

      - name: Build firmware
        run: |
          docker run --rm \
            -e LI_BAT_BUILD_VARIANT=release \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            "${{ steps.image.outputs.ref }}" \
            build

      - name: Pack versioned release assets
        run: |
          docker run --rm \
            -e LI_BAT_BUILD_VARIANT=release \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            "${{ steps.image.outputs.ref }}" \
            pack

      - name: Restore workspace ownership for runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}"

      - name: Attach cppcheck report
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cppcheck
          chmod +x qa/cppcheck/run_cppcheck.sh
          CPPCHECK_XML=1 ./qa/cppcheck/run_cppcheck.sh
          tar -C qa/cppcheck -czf dist/code_quality_report.tar.gz report
          (
            cd dist
            mapfile -t hashed < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt | sort)
            sha256sum "${hashed[@]}" > SHA256SUMS.txt
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish to IKEA OTA if secrets exist
        env:
          IKEA_OTA_URL: ${{ secrets.IKEA_OTA_URL }}
          IKEA_OTA_TOKEN: ${{ secrets.IKEA_OTA_TOKEN }}
        run: |
          chmod +x Srcipt/PublishOta.sh
          ./Srcipt/PublishOta.sh

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes_file="$(mktemp)"
          {
            echo "## Firmware ${tag}"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${{ steps.image.outputs.ref }}\`"
            echo
            echo "### Artifacts"
            echo
            find dist -maxdepth 1 -type f -printf '- %f\n' | sort
            echo
            echo "请在 Release 正文补充：变更摘要、已知问题、测试报告链接。"
          } > "${notes_file}"
          # 避免 dist/* 在无匹配时把字面量传给 gh
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          gh release create "${tag}" "${assets[@]}" \
            --title "Firmware ${tag}" \
            --notes-file "${notes_file}" \
            --verify-tag

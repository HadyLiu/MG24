# Release Firmware — Tag v* 正式发布

name: Release Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的版本 Tag（如 v1.1.6）；留空则仅构建并上传 Artifact'
        required: false
        default: ''

concurrency:
  group: release-firmware-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: li-bat-matterlight
  IMAGE_TAG: sdk-2025.12.2

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Resolve image reference
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull firmware build image
        run: docker pull "${{ steps.image.outputs.ref }}"

      - name: Build firmware
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            "${{ steps.image.outputs.ref }}" \
            build

      - name: Pack release assets
        id: pack
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          files=(artifact/*.s37 artifact/*.gbl)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: no artifacts under artifact/"
            exit 1
          fi
          cp -a "${files[@]}" dist/
          (
            cd dist
            sha256sum ./* > SHA256SUMS.txt
          )
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes_file="$(mktemp)"
          {
            echo "## Firmware ${tag}"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${{ steps.image.outputs.ref }}\`"
            echo
            echo "### Artifacts"
            echo
            ls -1 dist/ | sed 's/^/- /'
            echo
            echo "请在 Release 正文补充：变更摘要、已知问题、测试报告链接。"
          } > "${notes_file}"
          gh release create "${tag}" dist/* \
            --title "Firmware ${tag}" \
            --notes-file "${notes_file}" \
            --verify-tag

# CI Template — 可复用执行者（workflow_call）
# CodeAnalysis → UnitTest → Build → Release（仅 Tag）

name: CI Template

on:
  workflow_call:
    inputs:
      build_variant:
        description: 'dev（push/PR）或 release（Tag）'
        required: true
        type: string
      create_release:
        description: '是否创建 GitHub Release（仅 v* Tag）'
        required: true
        type: boolean

env:
  IMAGE_NAME: li-bat-matterlight
  IMAGE_TAG: sdk-2025.12.2

jobs:
  code-analysis:
    name: CodeAnalysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches firmware version
        if: ${{ inputs.create_release }}
        run: |
          chmod +x Srcipt/ReadFirmwareVersion.sh Srcipt/CheckReleaseTag.sh
          ./Srcipt/CheckReleaseTag.sh "${GITHUB_REF_NAME}"

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck cppcheck clang-format python3-pygments python3-pip
          pip install --user yamllint

      - name: Make QA scripts executable
        run: find docker Srcipt qa -type f -name '*.sh' -exec chmod +x {} +

      - name: ShellCheck scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find docker Srcipt qa -type f -name '*.sh' | sort)
          echo "Checking:"
          printf '  %s\n' "${scripts[@]}"
          shellcheck --severity=warning "${scripts[@]}"

      - name: YAML lint workflows
        run: ~/.local/bin/yamllint -c .github/yamllint.yml .github/workflows/

      - name: Download actionlint
        id: get_actionlint
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash \
            -o /tmp/download-actionlint.bash
          bash /tmp/download-actionlint.bash 1.7.12
        shell: bash

      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

      - name: clang-format check User/
        run: ./qa/format/run_clang_format.sh --check

      - name: Setup cpplint and cppcheck-htmlreport
        if: always()
        run: |
          ./qa/cpplint/setup.sh
          ./qa/cppcheck/setup.sh

      - name: cpplint User/
        if: always()
        run: ./qa/cpplint/run_cpplint.sh

      - name: cppcheck User/
        if: always()
        run: ./qa/cppcheck/run_cppcheck.sh

      - name: Pack code quality report
        if: always()
        run: ./qa/PackQualityReports.sh --quality-only qa

      - name: Upload code quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code_quality_report
          path: qa/code_quality_report.tar.gz
          if-no-files-found: error
          retention-days: 14

  unit-test:
    name: UnitTest
    needs: code-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y gcovr

      - name: Setup and run host unit tests
        run: |
          chmod +x qa/host/setup.sh qa/host/run_host_tests.sh qa/PackQualityReports.sh
          ./qa/host/setup.sh
          ./qa/host/run_host_tests.sh

      - name: Pack unit test report
        if: always()
        run: |
          chmod +x qa/PackQualityReports.sh
          ./qa/PackQualityReports.sh --unit-only qa

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit_test_report
          path: qa/unit_test_report.tar.gz
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Resolve image reference
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull firmware build image
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.ref }}"
          if ! docker pull "${image}"; then
            echo "::error::找不到镜像 ${image}"
            echo "请先：Actions → Docker Publish → Run workflow"
            exit 1
          fi

      - name: Allow container user to write workspace
        run: sudo chown -R 1000:1000 "${{ github.workspace }}"

      - name: Build firmware
        run: |
          docker run --rm \
            -e LI_BAT_BUILD_VARIANT=${{ inputs.build_variant }} \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            "${{ steps.image.outputs.ref }}" \
            build

      - name: Pack versioned release assets
        if: ${{ inputs.create_release }}
        run: |
          docker run --rm \
            -e LI_BAT_BUILD_VARIANT=${{ inputs.build_variant }} \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            "${{ steps.image.outputs.ref }}" \
            pack

      - name: Restore workspace ownership for runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            artifact/*.s37
            artifact/*.gbl
          if-no-files-found: error
          retention-days: 14

      - name: Upload release dist
        if: ${{ inputs.create_release }}
        uses: actions/upload-artifact@v4
        with:
          name: firmware-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    needs: build
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download firmware dist
        uses: actions/download-artifact@v4
        with:
          name: firmware-dist
          path: dist

      - name: Download quality reports
        uses: actions/download-artifact@v4
        with:
          pattern: '*_report'
          path: dist
          merge-multiple: true

      - name: Refresh SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          mapfile -t hashed < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt | sort)
          sha256sum "${hashed[@]}" > SHA256SUMS.txt

      - name: Publish to IKEA OTA if secrets exist
        env:
          IKEA_OTA_URL: ${{ secrets.IKEA_OTA_URL }}
          IKEA_OTA_TOKEN: ${{ secrets.IKEA_OTA_TOKEN }}
        run: |
          chmod +x Srcipt/PublishOta.sh
          ./Srcipt/PublishOta.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes_file="$(mktemp)"
          {
            echo "## Firmware ${tag}"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Variant: \`${{ inputs.build_variant }}\`"
            echo
            echo "### Artifacts"
            echo
            find dist -maxdepth 1 -type f -printf '- %f\n' | sort
            echo
            echo "请在 Release 正文补充：变更摘要、已知问题、测试报告链接。"
          } > "${notes_file}"
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          gh release create "${tag}" "${assets[@]}" \
            --title "Firmware ${tag}" \
            --notes-file "${notes_file}" \
            --verify-tag

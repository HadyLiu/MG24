# Docker Publish — 在 GitHub Actions 上执行 Dockerfile，推送到 GHCR
#
# 推荐：不要本机 docker push。打开 Actions → Docker Publish → Run workflow
# 预计 30～90+ 分钟（下载 SiSDK），成功后 CI Firmware 才能 pull 镜像。

name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '备注（可选）'
        required: false
        default: 'manual build via Dockerfile on GitHub'
  push:
    branches:
      - main
    paths:
      - docker/Dockerfile
      - docker/install-slt-packages.sh
      - docker/entrypoint.sh
      - docker/build-image.sh
      - .github/workflows/docker-publish.yml

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: li-bat-matterlight
  IMAGE_TAG: sdk-2025.12.2

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set image name
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "full=ghcr.io/${owner}/${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Will build and push: ghcr.io/${owner}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dockerfile and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.full }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            INSTALL_SLT_PACKAGES=1
          provenance: false

      - name: Summary
        run: |
          {
            echo "## Docker image published"
            echo
            echo "- Image: \`${{ steps.meta.outputs.full }}\`"
            echo "- Also tagged: \`${{ steps.meta.outputs.image }}:latest\`"
            echo
            echo "Next: Actions → **CI Firmware** → Run workflow"
          } >> "$GITHUB_STEP_SUMMARY"

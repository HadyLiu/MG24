# Docker Publish — 将完整固件编译镜像推到 GHCR
#
# CI Firmware 依赖此镜像。首次请手动 Run workflow（约 30～60+ 分钟），
# 或本机已有镜像时推送（见 .github/GITHUB_SETUP_zh.md）。

name: Docker Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docker/Dockerfile
      - docker/install-slt-packages.sh
      - docker/entrypoint.sh
      - docker/build-image.sh
      - .github/workflows/docker-publish.yml

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: li-bat-matterlight
  IMAGE_TAG: sdk-2025.12.2

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set image name
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "full=ghcr.io/${owner}/${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.full }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            INSTALL_SLT_PACKAGES=1
          # 不缓存巨型 SDK 层到 GHA cache（体积过大）
          provenance: false

# 宜家 OTA 可升级区间（闭区间）
# 设备当前版本落在 [OTA_MIN_VERSION, OTA_MAX_VERSION] 时，才允许升到本包 version。
# 本包 version 仍读 sl_matter_config.h（例如 1.1.7 → 0x01010007），必须大于 max。
#
# 填 A.B.C 或 0xAABB00CC。某一项留空则 pack 时自动推算：
#   min 空 = 本系列起点（1.1.7 → 1.1.0 / 0x01010000）
#   max 空 = 本包 version - 1（1.1.7 → 1.1.6 / 0x01010006）
#
# 例：只让 1.1.0～1.1.4 升到 1.1.5
#   OTA_MIN_VERSION=1.1.0
#   OTA_MAX_VERSION=1.1.4

OTA_MIN_VERSION=1.1.0
OTA_MAX_VERSION=
